<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recrutamento Online</title>
    <meta charset="UTF-8">
</head>
<body>
    <header>
        <h1>Recrutamento Online</h1>
    </header>
    <main>
        <section>
            <h2>Cadastre seu currículo</h2>
            <form action="#" method="get">
                
                  <p>  Preencha o formulário para se candidatar à vaga</p>
                 <fieldset>
                    <legend>Dados Pessoais </legend>
                    <div>
                        <label for="nome_id">Nome completo:</label>
                        <input id="nome_id" name="nome" type="text">
                    </div>
                    <div>
                        <label for="telefone_id">Telefone:</label>
                        <input id="telefone_id" name="telefone" type="tel">
                    </div>
                    <div>
                        <label for="email_id">Email:</label>
                        <input id="email_id" name="email" type="email">
                    </div>
                    <div>
                        <label for="data_nasc_id">Data de nascimento:</label>
                        <input id="data_nasc_id" name="data_nasc" type="date">
                    </div>
                 </fieldset>
                 <fieldset>
                    <legend>Endereço</legend>
                    <div>
                        <label for="logradouro_id">Logradouro:</label>
                        <input id="logradouro_id" name="Logradouro" type="text">
                    </div>
                    <div>
                        <label for="cidade_id">Cidade-UF:</label>
                        <input id="cidade_id" name="cidade" type="text">
                    </div>
                    <div>
                        <label for="numero_id">Número:</label>
                        <input id="numero_id" name="numero" type="number">
                    </div>
                 </fieldset>
                 <fieldset>
                    <legend>Biografia</legend>
                    <div>
                        <label for="resumo_id">fala sobre você</label>
                        <textarea id="resumo_id"
                                  name="resumo" 
                                  rows="10" 
                                  cols="250"></textarea>
                    </div>

                 </fieldset>
                 <fieldset>
                    <legend>Nível pretendido</legend>
                    <div>
                        <input id="estagiario_id"
                               name="nivel"
                               type="radio"
                               value="estagiario">
                        <label for="estagiario_id">Estagiario</label>       
                    </div>
                    <div>
                        <input id="junior_id"
                               name="nivel"
                               type="radio"
                               value="junior">
                        <label for="junior_id">júnior</label>
                    </div>
                 </fieldset>
                 <fieldset>
                    <legend>Tecnolopgias</legend>
                    <div>
                        <input id="tec_html_id"
                               name="tecnologia"
                               type="checkbox"
                               value="html">
                        <label for="tec_html_id">HTML</label>       
                    </div>
                    <div>
                         <input id="tec_css_id"
                               name="tecnologia"
                               type="checkbox"
                               value="css">
                        <label for="tec_css_id">CSS</label>  
                    </div>
                    <div>
                         <input id="tec_js_id"
                               name="tecnologia"
                               type="checkbox"
                               value="js">
                        <label for="tec_js_id">JavaScript</label>  
                    </div>
                 </fieldset>
                 <fieldset>
                    <legend>Grau de instruçâo</legend>
                    <div>
                        <label for="escolaridade_id">Escolaridade:</label>
                        <select id="escolaridade_id" name="escolaridade">
                            <option value="medio">Ensino Médio</option>
                            <option value="graduacao">Graduação</option>
                            <option value="pos">Pós-graduação</option>
                        </select>
                    </div>
                 </fieldset>
                 <div>
                    <button type="reset">Limpar Dados</button>
                    <button type="submit">Enviar candidatura</button>
                 </div>
            </form>
        </section>
    </main>
    <footer>
        <p>Todos os direitos reservados</p>
    </footer>
</body>
</html>
