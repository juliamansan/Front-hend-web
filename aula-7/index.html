<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/global.css">
    <script src="scripts/index.js" defer></script>
    <title>Formulário JS</title>
</head>
<body>
    <header>
        <h1>Formulario super simples</h1>

    </header>
    <main>
        <h2>Cadastro</h2>
        <form id="Cadastro">
            <label for="nome">Nome*</label>
            <input type="texto" id="nome">
            <span id="erro-nome" class="oculto"></span>

            <label for="idade">Idade*</label>
            <input type="number" id="idade">
            <span id="erro-idade" class="oculto"></span>

            <label for="email">Email*</label>
            <input type="email" id="email">
            <span id="erro-email" class="oculto"></span>

            <label>
                <input type="checkbox" id="termos">
               <span style="display: inline;">Li e aceito os termos</span> 
                <span id="erro-termos" class="oculto"></span>
            </label>

            <button onclick="executar(event)">Enviar</button>
            <p id="concluido" class="oculto"></p>

        </form>

    </main>
    <footer>
        <p>Projeto para conhecermos o JavaScript</p>
    </footer>
    
</body>
</html>
